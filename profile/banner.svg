    <circle cx="362" cy="256" r="52" fill="#F59E0B"/>
  </g>
  <text class="ink" x="300" y="150" font-size="68" font-weight="700" letter-spacing="-1">Craft Collective</text>
  <text class="soft" x="302" y="206" font-size="28">Shared forks of the Craft apps, for features upstream hasn't merged yet.</text>
  <text class="soft" x="302" y="248" font-size="28">Decided by their members. Kept current every week.</text>
