<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <style>
    .bg { fill: #FBF7F0; } .ink { fill: #17212B; } .line { stroke: #17212B; } .soft { fill: #5B6672; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0F161D; } .ink { fill: #F4EBDD; } .line { stroke: #F4EBDD; } .soft { fill: #A8B0B8; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect class="bg" width="1280" height="320" rx="24"/>
  <g transform="translate(72 64) scale(0.375)">
    <g fill="none" class="line" stroke-width="34" stroke-linecap="round">
      <path d="M150 92 V420"/>
      <path d="M150 176 C 252 176, 290 256, 362 256"/>
      <path d="M150 336 C 252 336, 290 256, 362 256"/>
    </g>
    <circle class="ink" cx="150" cy="176" r="32"/>
